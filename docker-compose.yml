services:
  web:
    image: nginx:alpine
    container_name: daintytrading-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_started
    networks:
      - dainty-net

  api:
    build: ./api
    container_name: daintytrading-api
    restart: unless-stopped
    env_file: ./api/.env
    environment:
      - TZ=Australia/Sydney
    volumes:
      - ./api/data:/app/data
    ports:
      - "127.0.0.1:3013:3001"
    mem_limit: 128m
    networks:
      - dainty-net

networks:
  dainty-net:
