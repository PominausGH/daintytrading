services:
  web:
    image: nginx:alpine
    container_name: daintytrading-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # The repo root is the web root, so everything in it is public BY DEFAULT
    # and stays private only while an nginx deny rule remembers it. That is a
    # blocklist, and it already failed once: the *.js static rule matched the
    # API's own source and served /api/lib/auth.js to the internet.
    #
    # Mask the private directories with empty tmpfs so they are not merely
    # denied but ABSENT inside this container. A future config change cannot
    # expose a file that isn't there. The deny rules stay as the second layer.
    #
    # /api/ still proxies to the api service: proxying never touches this
    # filesystem, so masking the directory costs nothing.
    tmpfs:
      - /usr/share/nginx/html/api
      - /usr/share/nginx/html/.git
      - /usr/share/nginx/html/scripts
      - /usr/share/nginx/html/prompts
    depends_on:
      api:
        condition: service_started
    networks:
      - dainty-net
      - postgres-main-network

  api:
    build: ./api
    container_name: daintytrading-api
    restart: unless-stopped
    env_file: ./api/.env
    environment:
      - TZ=Australia/Sydney
    volumes:
      - ./api/data:/app/data
      - ../customer-web_check/reports:/app/prospects-reports:ro
    ports:
      - "127.0.0.1:3013:3001"
    mem_limit: 128m
    networks:
      - dainty-net

networks:
  dainty-net:
  postgres-main-network:
    external: true
