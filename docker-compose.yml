services:
  web:
    image: nginx:alpine
    container_name: daintytrading-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx:/etc/nginx/conf.d:ro
    # Astro migration (2026-09-09): the web root used to be the bind-mounted repo
    # root, which needed tmpfs masks over api/.git/scripts/prompts so a config
    # slip couldn't expose them (see git blame for the incident that taught us
    # that lesson). Now nginx only ever sees `dist/` — Astro's build output,
    # which by construction contains only public/ assets and rendered pages —
    # so there's nothing left to mask. `dist/` doesn't exist until `npm run
    # build` runs at least once; see scripts/dainty-deploy-build.sh, which also
    # needs a cron entry added (not done automatically — see PR description).
    #
    # 2026-09-22: nginx.conf used to be bind-mounted directly as a single file
    # (./nginx.conf:/etc/nginx/conf.d/default.conf). Docker pins a single-file
    # bind mount to the inode it saw at container start; git's checkout/pull
    # replaces a changed file via unlink+rename (a new inode), so the running
    # container kept serving the pre-change content forever afterward — no
    # `nginx -s reload` in the world fixes that, since reload just re-reads
    # the same stale mount, and only a full container recreate/restart
    # re-resolves it. A CSP fix (PR #69) merged, built, and "deployed" per the
    # script's own log, then sat invisible on the live site until manually
    # caught and the container force-restarted by hand. Bind-mounting the
    # whole directory instead sidesteps the inode-pinning problem entirely —
    # a directory bind mount resolves file lookups fresh each time, so a
    # replaced file inside it is picked up immediately, and
    # scripts/dainty-deploy-build.sh's nginx reload (see its own history) now
    # actually works instead of silently no-oping.
    depends_on:
      api:
        condition: service_started
    networks:
      - dainty-net
      - postgres-main-network

  api:
    build: ./api
    container_name: daintytrading-api
    restart: unless-stopped
    env_file: ./api/.env
    environment:
      - TZ=Australia/Sydney
    volumes:
      - ./api/data:/app/data
      - ../customer-web_check/reports:/app/prospects-reports:ro
    ports:
      - "127.0.0.1:3013:3001"
    mem_limit: 128m
    networks:
      - dainty-net
      - litellm_default

networks:
  dainty-net:
  postgres-main-network:
    external: true
  litellm_default:
    external: true
