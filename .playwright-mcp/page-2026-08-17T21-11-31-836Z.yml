          - heading "Proven plumbing, not glued-together demos" [level=3] [ref=f14e80]
          - paragraph [ref=f14e81]: "We’ve already built the layer most AI projects trip over — routing, billing, observability, evals. Every client gets it on day one, because we run it for our own products first. Stack: Claude · LiteLLM · n8n · FastAPI · Postgres"
        - generic [ref=f14e82]:
          - generic [ref=f14e83]: "04"
          - heading "We align on P&L, not feature lists" [level=3] [ref=f14e84]
          - paragraph [ref=f14e85]: AI that doesn’t reduce headcount, cut support tickets, or generate revenue isn’t AI — it’s a line item. We build to measurable outcomes and tell you what success looks like before we start.
