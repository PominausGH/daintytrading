      - generic [ref=f14e141]:
        - heading "AI Development Services" [level=2] [ref=f14e142]
        - paragraph [ref=f14e143]: We don’t do AI demos. We ship AI features that show up in your P&L. Four things, done well.
      - generic [ref=f14e144]:
        - generic [ref=f14e145]:
          - generic [ref=f14e146]: "01"
          - heading [level=3] [ref=f14e147]:
            - link "AI product builds" [ref=f14e148] [cursor=pointer]:
              - /url: /services/ai-product-builds.html
          - paragraph [ref=f14e149]: Full-stack delivery. We take an idea — yours or ours — and ship a paying product. Backend, frontend, mobile, billing, observability, and the LLM glue that makes it real.
        - generic [ref=f14e150]:
          - generic [ref=f14e151]: "02"
          - heading [level=3] [ref=f14e152]:
            - link "Automation retrofits" [ref=f14e153] [cursor=pointer]:
              - /url: /services/ai-automation-retrofit.html
          - paragraph [ref=f14e154]: Already have a SaaS or internal tool? We bolt in AI where it earns its keep — email triage, support deflection, content generation, structured extraction — without rewriting the world.
        - generic [ref=f14e155]:
          - generic [ref=f14e156]: "03"
          - heading [level=3] [ref=f14e157]:
            - link "AI infrastructure" [ref=f14e158] [cursor=pointer]:
              - /url: /services/ai-infrastructure.html
          - paragraph [ref=f14e159]: LLM gateways, prompt versioning, evals, queue workers, billing plumbing, observability. The unsexy layer that decides whether your AI feature stays up at 3am.
        - generic [ref=f14e160]:
          - generic [ref=f14e161]: "04"
          - heading [level=3] [ref=f14e162]:
            - link "SEO & GEO optimization" [ref=f14e163] [cursor=pointer]:
              - /url: /services/seo-geo-optimization.html
          - paragraph [ref=f14e164]: Get found by Google and by AI answer engines. We audit and fix meta tags, schema markup, llms.txt, and AI-crawler access — shipped directly to your codebase, not a PDF. Free audit, Setup from $2,900 AUD — not the $5k–$15k-plus retainer agencies typically quote for the same audit-and-fix scope.
    - generic [ref=f14e166]:
      - generic [ref=f14e167]:
        - heading "How we work" [level=2] [ref=f14e168]
        - paragraph [ref=f14e169]: No retainers, no long SoWs to sign. Three steps from brief to paying customers.
      - generic [ref=f14e170]:
        - generic [ref=f14e171]:
