          - paragraph [ref=f14e174]: "Tell us the workflow or product in two paragraphs. We come back with a realistic scope: what ships in sprint one, what the stack looks like, and what it costs. No proposal theatre."
        - generic [ref=f14e175]:
          - generic [ref=f14e176]: "02"
          - heading "Sprint one → demo in 1–2 weeks" [level=3] [ref=f14e177]
          - paragraph [ref=f14e178]: We don’t start with architecture reviews. We ship the smallest thing that proves the idea works, put it in front of a real user, and let you decide whether to continue. One working feature. Deployed. Clickable.
        - generic [ref=f14e179]:
          - generic [ref=f14e180]: "03"
          - heading "Iterate to a product → weeks 3–8" [level=3] [ref=f14e181]
          - paragraph [ref=f14e182]: Each sprint adds one feature that earns its keep. Daily written updates. Weekly live demo. You own the roadmap; we own the execution. By week eight, you have paying customers or we’ve told you why.
