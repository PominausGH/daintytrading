          - heading "Speed that’s earned, not promised" [level=3] [ref=f14e76]
          - paragraph [ref=f14e77]: First working demo in 1–2 weeks. First paying customer in 4–8 weeks. We move fast because we’ve already built the boring parts — billing, auth, LLM routing, observability — and reuse them across every project.
        - generic [ref=f14e78]:
