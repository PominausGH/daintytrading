server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # This origin only ever sees plain HTTP (TLS terminates at the edge), so
    # nginx's self-generated redirects (e.g. the /admin -> /admin/ trailing
    # slash redirect) would otherwise hardcode "http://" into the Location
    # header. Relative redirects let the browser keep whatever scheme it
    # actually connected with.
    absolute_redirect off;

    # ----- Security headers (server-level base) ----------------------------
    # nginx silently drops parent `add_header` directives in any location that
    # has its own `add_header` — so we repeat them in each response-producing
    # location below. This block sets the defaults; the location blocks
    # re-apply the same set so behaviour is consistent.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://analytics.daintytrading.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://analytics.daintytrading.com; object-src 'none'; base-uri 'self'" always;

    # Pretty URLs: /services -> /services.html, /projects/foo -> /projects/foo.html
    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://analytics.daintytrading.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://analytics.daintytrading.com; object-src 'none'; base-uri 'self'" always;
    }

    # Long cache for static assets, but must revalidate to pick up changes
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://analytics.daintytrading.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://analytics.daintytrading.com; object-src 'none'; base-uri 'self'" always;
    }

    # Short cache for HTML
    location ~* \.html$ {
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://analytics.daintytrading.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://analytics.daintytrading.com; object-src 'none'; base-uri 'self'" always;
    }

    # SEO / agent-discovery infra files — explicit content types and cache
    location = /robots.txt {
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://analytics.daintytrading.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://analytics.daintytrading.com; object-src 'none'; base-uri 'self'" always;
    }
    location = /llms.txt {
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://analytics.daintytrading.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://analytics.daintytrading.com; object-src 'none'; base-uri 'self'" always;
    }
    location = /llm.txt {
        rewrite ^/llm\.txt$ /llms.txt last;
    }

    # 301 redirect for typo in old project URL
    location = /projects/screenshoot-cleaner.html {
        return 301 https://daintytrading.com/projects/screenshot-cleaner.html;
    }

    # Consolidated into /australia.html — was thin/duplicate geo pages
    location = /sydney.html {
        return 301 https://daintytrading.com/australia.html;
    }
    location = /central-coast.html {
        return 301 https://daintytrading.com/australia.html;
    }
    location = /sitemap.xml {
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://analytics.daintytrading.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://analytics.daintytrading.com; object-src 'none'; base-uri 'self'" always;
    }

    # Proxy API requests to the Node.js service
    location /api/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 10s;
    }

    # Custom error pages
    error_page 404 /404.html;
    location = /404.html { internal; }

    # Hide the docker/nginx config files from the web
    location ~ /(docker-compose\.yml|nginx\.conf)$ { deny all; }

    # Hide git internals and internal-only dev files — the repo root is
    # bind-mounted as the web root (docker-compose.yml), so anything not
    # meant to be public needs an explicit deny here.
    location ~ /\.git { deny all; return 404; }
    location ~ ^/(scripts|prompts)/ { deny all; return 404; }
    location ~ \.mjs$ { deny all; return 404; }
    location = /page-audit-prompt.md { deny all; return 404; }
    location = /generate-og-images.js { deny all; return 404; }
}
