<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Login — Dainty Trading</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0a0c10" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css?v=20260809" />
  <style>
    .login-wrap { max-width: 360px; margin: 100px auto; padding: 0 24px; }
    .login-card { padding: 28px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-card); }
    .login-card label { display: block; font-size: 14px; color: var(--text-dim); margin-bottom: 6px; }
    .login-card input {
      width: 100%; padding: 12px 14px; border-radius: 10px; margin-bottom: 16px;
      background: var(--bg-elev); border: 1px solid var(--border); color: var(--text); font: inherit;
    }
    .login-card input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,92,255,0.18); }
    .login-card button { width: 100%; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1 style="font-size:20px;margin:0 0 20px;">Dainty Trading admin</h1>
      <form id="login-form" novalidate>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required autocomplete="current-password" autofocus />
        <button type="submit" id="login-submit" class="btn btn-primary">Log in</button>
        <p id="login-error" class="muted" style="font-size:13px;color:#f87171;display:none;margin-top:14px;"></p>
      </form>
    </div>
  </div>
  <script defer src="/js/admin-login.js"></script>
</body>
</html>
